[package]
name = "wasmcloud-provider-sqldb-mysql"
version = "0.1.0"
edition = "2021"
description = """
wasmcloud SQL database provider for Mysql
"""

[workspace]

[badges.maintenance]
status = "actively-developed"

[dependencies]
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
mysql_async ={ version = "*"}
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
num-traits = "0.2"
tracing = "0.1"
sha2 ={ version = "0.10"}
uuid ={ version = "1"}
ulid ={ version = "1"}
futures ={ version = "0.3"}
wasmcloud-core = { version = "0.20", features = ["messaging"]}
wasmcloud-provider-sdk = { version = "0.16.0", features = ["otel"] }
wasmcloud-provider-messaging-nats = "0.27.0"
wit-bindgen-wrpc = "0.9.0"
wascap = "0.16"
wasip3 = "0.2.0"
